<!doctype html>
<meta charset="utf-8">
<title>GD_DTTT — Grim Dawn Devotion Theory-craft and Tracker Tool</title>
<!--
  Standalone mockup of the keyword picker. Reads ui-index.json (built by
  scripts/build-ui-index.mjs) rather than inlining data, so it stays in sync
  with the extraction.

  Serve it, don't open with file:// -- fetch() needs an origin:
      cd devotion-planner && python3 -m http.server 8080
      open http://localhost:8080/src/ui-mockup.html

  From WSL, the repo lives on the Windows drive:
      cd /mnt/d/gd-extract/devotion-planner && python3 -m http.server 8080
  and localhost is forwarded, so the URL above works in the Windows browser unchanged.
  Hard-refresh (Ctrl+Shift+R) after a rebuild -- ui-index.json is cached.

  The right panel is a real ordered path: lib/select.mjs picks a legal set of
  constellations, lib/schedule.mjs orders them and inserts/refunds Crossroads.
  Steps are numbered in the order you click them in game; click one to tick it off.

  There is no Build button: any change to the tags, their weights or the scoring mode
  re-solves automatically, debounced, with a status line that shows when it's working.
  The solve is synchronous, so its time budget is capped at a level measured to give
  the same answer as a much longer one (see SOLVE_BUDGET_MS).

  Selection is lib/solver.mjs -- local search, good but not proven optimal. Swap in
  the MILP (lib/milp.mjs + glpk.js) for a certificate; it returns the same
  [{id, starsTaken}] shape the scheduler consumes.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px;background:#000;color:#fff;font:13px/1.5 system-ui,sans-serif}
*{box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto}
.col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
/* Back to a single column: the three-across grid coupled card heights within a row,
   and the slack that created was worse than the space it saved. */
.cards{display:block}
.cards .card{margin-bottom:8px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a8a8a;margin:0 0 7px}
/* Height follows the star control: 26px glyphs in 34px buttons need room, and
   `overflow:hidden` on a pill this shape would clip the glow rather than let it spill. */
.slot{display:flex;align-items:center;gap:4px;width:100%;height:44px;padding:0 6px 0 12px;border-radius:999px;margin-bottom:8px;background:#1c1c1c;color:#fff;font:inherit;text-align:left}
/* 16px, up from the inherited 13px: at 13px the tag name looked undersized next to a
   26px star and a 25px remove button. Sized to the controls, not to the body text. */
.slot > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:16px;line-height:1.2}
.empty{border:1px solid #3a3a3a;color:#4f4f4f;cursor:default}
.full{border:1px solid #fff;cursor:pointer}
.rb{width:25px;height:25px;flex:none;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:#2e2e2e;color:#fff;cursor:pointer;padding:0}
.chip .rb{pointer-events:none}
.empty .rb{background:#232323;color:#3f3f3f}
.full .rb:hover{background:#f2f2f2;color:#111}
.tab{flex:1;height:31px;border-radius:6px;border:1px solid #333;background:#111;color:#9a9a9a;font-size:12px;cursor:pointer}
.tab.on{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.cat{border-top:1px solid #262626}
.cath{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 2px;background:none;border:0;color:#cfcfcf;font-size:12px;cursor:pointer;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;margin:0 5px 5px 0;border-radius:999px;background:#161616;border:1px solid #333;color:#e6e6e6;font:inherit;font-size:12px;cursor:pointer}
.chip .rb{width:20px;height:20px}
.chip:hover:not(.used){background:#242424;border-color:#6a6a6a}
.chip:hover:not(.used) .rb{background:#f2f2f2;color:#111}
.chip.used{opacity:.35;cursor:default}
/* Blocked: this power cannot share 55 points with the ones already chosen. Struck
   through rather than merely faded, so it reads as "not available" instead of "already
   taken" -- the .used styling above means the opposite thing. */
.chip.blocked{opacity:.4;cursor:not-allowed;text-decoration:line-through;
  border-color:#3a2a2a;color:#8a7070}
.chip.blocked .rb{background:#241a1a;color:#6a4a4a}
/* Coverage row for a celestial power: binary, so no bar and no got/ceiling. */
.covrow.pow .cb{background:none;height:auto}
.covrow.pow .powcons{font-size:10px;color:#8a8a8a;white-space:nowrap}
.covrow.pow .cv{color:#4ade80}
.covrow.pow.zero .cv{color:#6a6a6a}
.cpc{display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:999px;
  background:#0d2f27;border:1px solid #7fffd4;color:#7fffd4;vertical-align:1px}
/* Where the weight dots would be on a power pill: a fixed marker, not a control. */
.tgt{display:flex;align-items:center;gap:3px;flex:none;font-size:9px;letter-spacing:.06em;
  text-transform:uppercase;color:#7fffd4;opacity:.75;cursor:default;padding:0 2px}
.tgt i{font-size:12px}
.slot.full.pow{border-color:#7fffd4}
.row{border-bottom:1px solid #1f1f1f;padding:9px 2px}
.n{font-size:11px;color:#8a8a8a}
.card{background:#1c1c1c;border:1px solid #fff;border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{background:#242424}
/* Completed: recede via border and a check, NOT opacity -- the text has to stay
   readable because you still need to see what a finished constellation gave you. */
.card.done{border-color:#3f6047;background:#161b17}
.card.done:hover{background:#1c231d}
/* The one you're on. */
/* "You are here" is deep blue, not amber. Amber already means a weight-2 tag, an
   under-served coverage row and the solving pulse; a fourth meaning made it noise.
   Burnt orange sits between the weight-1 red (hue 358) and the weight-2 amber (44) at
   hue 20, and no affinity claims it -- Chaos is rose, Order gold. It is also warm
   enough to read as "active" rather than as a warning. */
.card.current{border-color:#e8743c;
  box-shadow:0 0 0 1px rgba(232,116,60,.45),0 0 16px rgba(232,116,60,.26)}
.card.refund{border-color:#3a3a3a;background:#131313;cursor:default}
.card.refund:hover{background:#131313}
.card.refund .nm{color:#8a8a8a;font-size:12px}
.step{display:flex;align-items:baseline;gap:9px;padding:9px 11px}
.step .num{font-variant-numeric:tabular-nums;font-size:11px;color:#8a8a8a;min-width:18px}
.step .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
/* Title and CP badge share a line. They are separate elements so each can carry its own
   tooltip, but `.body` is a flex COLUMN, so without this row the badge became a
   full-width block on its own line. */
.nmrow{display:flex;align-items:baseline;gap:7px;min-width:0}
.nmrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmrow .cp{flex:none}
.step .nm{font-size:13px}
.stars{border-top:1px solid #2e2e2e;padding:4px 0 5px}
.star{display:flex;gap:7px;padding:4px 10px;font-size:11px;color:#8a8a8a;cursor:pointer;align-items:flex-start}
.star:hover{background:#2a2a2a}
/* Bought stars. A strike-through inside a 10px rounded pill is invisible, so the
   line dims and a green check closes it instead -- the same signal as the tick box,
   read the same way. The check is excluded from the dimming rather than the whole
   line being faded, or the one element that says "done" would be the faintest. */
.star.sdone .stxt > *:not(.sck){opacity:.4}
.star.sdone .sn{opacity:.5}
.sck{color:#4ade80;font-size:11px;line-height:1;margin-left:1px}
/* Effect tooltip. Fixed position so nesting inside the re-rendered tree costs nothing,
   and pointer-events:none so it can never sit between the cursor and the row that
   summoned it -- which would flicker as the mouseover bounced between the two. */
.tip{position:fixed;left:0;top:0;z-index:40;max-width:420px;
  padding:11px 14px;border-radius:9px;border:1px solid #3a3a3a;background:#141414;
  box-shadow:0 8px 24px rgba(0,0,0,.65);
  /* 16px to match the target tag labels exactly -- two readouts at 16 and 17 look like
     a mistake rather than a hierarchy. */
  font-size:16px;line-height:1.5;color:#cfcfcf;
  display:none;pointer-events:none}
/* A flex column with one gap, so every row shares the same rhythm. */
.tip.on{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.tip b{display:block;margin-bottom:6px;color:#7fffd4;font-weight:600;font-size:16px;
  letter-spacing:.04em;text-transform:uppercase}
/* One bullet column for every row, so the text starts at the same x whether or not the
   line is tagged. Padding-left plus a negative-indent bullet keeps that alignment even
   when a line wraps. */
.tip span{display:block;position:relative;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;line-height:1.4;padding-left:26px}
/* The marker is positioned ABSOLUTELY in a fixed 26px column, centred both ways.
   An inline-block ::before could not do this: `width` in `em` resolves against the
   pseudo-element's OWN font-size, so a 1.5em-wide box at font-size 1.5em is 2.25em
   while the same box at 1em is 1.5em -- the two markers sat in columns of different
   widths and the text after them never lined up. In px, out of flow, the column is the
   same for both no matter how the glyphs are sized. */
.tip span::before{content:'·';position:absolute;left:0;top:50%;
  transform:translateY(-50%);width:26px;text-align:center;line-height:1;
  font-size:30px;color:#8a8a8a}
/* A bonus that serves one of your tags is bulleted with a STAR in that tag's weight
   colour -- the same red/amber/green as the weight control, so the two readouts agree
   without needing a legend, and the marker matches the metaphor. */
.tip span.hit{font-weight:600;color:#e8e8e8}
/* Only the glyph and its size change -- the column geometry is inherited, so the two
   markers cannot drift apart. */
.tip span.hit::before{content:'\2605';font-size:17px}
.tip span.hit.w1::before{color:#e5484d;text-shadow:0 0 7px rgba(229,72,77,.6)}
.tip span.hit.w2::before{color:#e8c15a;text-shadow:0 0 7px rgba(232,193,90,.6)}
.tip span.hit.w3::before{color:#4ade80;text-shadow:0 0 7px rgba(74,222,128,.6)}
/* The card title and the CP badge are now hover targets. */
.step .nm[data-fx],.step .cp[data-fx]{cursor:help}
.step .nm[data-fx]:hover{color:#fff;text-decoration:underline dotted #5a5a5a}

/* The next star to buy. Same hue as the current card's border (#e8743c), but as a dark
   tint plus a solid left bar rather than a solid orange fill. A solid fill would need
   dark text, and this row carries tag pills (.tg, light-on-dark) that would then have to
   invert too -- the bar carries the colour at full strength instead, and matches how the
   current row is marked in Overview. Flat, no glow: the card is already glowing, and two
   glows on screen stop meaning "here". */
.star.snext{background:#341f10;box-shadow:inset 3px 0 0 #e8743c}
.star.snext:hover{background:#442916}
.star.snext .sn{color:#ff9d6b;font-weight:600}
.star .sn{color:#5f5f5f;min-width:12px;font-variant-numeric:tabular-nums;padding-top:2px}
/* Tree gutter: one monospace character per level, so it lines up down the column
   without needing a fixed width per row. Empty on the root, which costs nothing. */
.star .stree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
  line-height:1.35;color:#4a4a4a;white-space:pre;padding-top:2px;letter-spacing:0}
.star.snext .stree{color:#9c6238}
.star.sdone .stree{opacity:.45}
.star .stxt{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.star .nm2{color:#e6e6e6;margin-right:2px}
.tg{display:inline-block;font-size:10px;line-height:1;padding:3px 7px;border-radius:999px;background:#2b2b2b;border:1px solid #3d3d3d;color:#e6e6e6}
.tg.other{background:none;border-style:dashed;color:#6f6f6f}
/* The celestial power reads as its own name, not a badge bolted onto one. */
.cpname{display:inline-block;font-size:10px;line-height:1;padding:3px 8px;border-radius:999px;
        background:#0d2f27;border:1px solid #7fffd4;color:#7fffd4}
.cp{display:inline-block;font-size:10px;line-height:1;padding:3px 8px;border-radius:999px;
    background:#0d2f27;border:1px solid #7fffd4;color:#7fffd4;vertical-align:1px}
.nm .cp{margin-left:6px}
/* Affinity as an ORB rather than a pill. A card's affinities are a fixed, tiny set of
   numbers, so the word was doing no work the colour didn't already do -- and dropping it
   buys back enough width to sit them on the title line. The name lives in the tooltip.
   Reuses the .af-* classes below for colour, which is why those set only colour,
   border-colour and background and no geometry. */
.orbs{display:flex;gap:4px;flex:none;margin-left:auto;align-self:center}
.orb{display:inline-flex;align-items:center;justify-content:center;flex:none;
  width:22px;height:22px;border-radius:50%;border:1px solid #3a3a3a;
  font-size:10px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;
  color:#cfcfcf;cursor:help}
.orb.none{border-style:dashed;color:#5f5f5f;font-weight:400}
/* Points spent is a SQUARE, not a circle -- white alone was too weak a signal sitting
   first in a row of five coloured discs, and shape survives being glanced at. Slightly
   rounded so it still belongs to the same set of chips. */
.orb.pts{color:#f2f2f2;border-color:#9a9a9a;background:rgba(255,255,255,.11);
  border-radius:5px}
/* Running ledger, dropped in between the last completed card and the one you are on.
   It answers "what do I hold right now" at the exact point in the column where you are
   reading, which is what the per-card `holding ...` line was trying to do from inside
   every card at once. Dashed, so it reads as an annotation on the path rather than
   another step in it. */
/* Shrink-wraps its orbs and centres itself, rather than spanning the column. A
   full-width box reads as another step in the path; a small one reads as a marker
   between two of them, which is what it is. `fit-content` + auto margins keeps the
   width tied to the contents, so the row can't stretch if an affinity ever gains a
   second digit. */
.ledger{display:flex;align-items:center;width:fit-content;
  padding:7px 12px;margin:0 auto 8px;
  border-radius:999px;border:1px dashed #3f3f3f;background:#171717}
/* Matches `.cards .card` so the strip keeps the column's rhythm instead of sitting
   tight against the card below it. */
.ledger .orbs{margin:0;gap:6px}
/* All five affinities, always, in a fixed order -- so the same affinity is in the same
   place in every ledger and you read position rather than colour. The ones you have
   none of stay in the row and recede; dropping them would reflow the row every time a
   constellation completed. */
.orb.zero{opacity:.3}
/* Affinity colours, sampled from the in-game orbs and lifted for legibility on the
   #1c1c1c card -- the in-game orbs are mid-tone and would sit too close to the
   background. Text carries the hue, the border a dimmer version of it, and the fill is
   the same hue at low alpha so five orbs in a row don't shout. Colour only, no geometry:
   .orb owns the shape, and these have to be able to tint it.

   DELIBERATELY PUSHED OFF the weight-star palette (red #e5484d, amber #e8c15a, green
   #4ade80), which already means "how much you asked for this". Sampled straight, Chaos
   and Eldritch sat close to the red and green stars. Chaos moves to rose and Eldritch
   to lime. Order keeps its true gold: it only ever clashed with the current-card
   outline, and that is deep blue now. It still shares a hue with the weight-2 star, but
   those never appear in the same readout. */
.af-ascendant {color:#b98ce8;border-color:#6f4b96;background:rgba(168,123,224,.13)}
.af-chaos     {color:#ff5c9d;border-color:#93335c;background:rgba(255,92,157,.13)}
.af-eldritch  {color:#b5e550;border-color:#6a8a2c;background:rgba(181,229,80,.13)}
.af-order     {color:#f0ce6b;border-color:#8e7431;background:rgba(232,193,90,.13)}
.af-primordial{color:#5cb0f0;border-color:#2d6795;background:rgba(62,155,229,.13)}
.card.done .orb{border-color:#3f6047}
.total{padding:10px 2px;font-size:12px;color:#cfcfcf;border-top:1px solid #333;margin-top:4px}
/* Overview. Fixed columns and a monospace gutter so the eye can run straight down
   the numbers -- proportional digits defeat the whole point of a scan view. */
.plainbtn{background:transparent;border:1px solid #3a3a3a;color:#8a8a8a;border-radius:6px;
  font:inherit;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;cursor:pointer}
.plainbtn:hover:not([disabled]){border-color:#666;color:#ddd}
.plainbtn.on{border-color:#fff;color:#fff}
.plainbtn[disabled]{opacity:.35;cursor:default}
.plainbtn i{font-size:12px;vertical-align:-2px;margin-right:1px}
/* The re-order question, as a modal over the devotions list.
   It interrupts because it is a fork, not a nicety: until it's answered the numbers
   below describe a different playthrough from yours. Both ways out are explicit --
   with the list covered, "ignore it" can't be how you decline. */
.dwrap{position:relative}
.modal{position:absolute;inset:0;z-index:5;display:flex;align-items:center;
  justify-content:center;padding:14px;overflow:auto;
  background:rgba(6,6,6,.82);backdrop-filter:blur(2px);border-radius:10px}
/* Red is the OUTLINE only. The box itself stays the same dark grey as everything else,
   so the red reads as "answer this" rather than tinting the content as an error. */
.mbox{width:100%;max-width:400px;padding:16px 17px;border-radius:12px;
  border:1px solid #e5484d;background:#151515;
  box-shadow:0 0 0 3px rgba(229,72,77,.14),0 14px 34px rgba(0,0,0,.65)}
.mtitle{margin:0 0 5px;font-size:13.5px;font-weight:600;color:#fff}
.mtext{margin:0 0 12px;font-size:12px;line-height:1.5;color:#a8a8a8}
.mopts{display:flex;flex-direction:column;gap:7px}
.mbtn{display:block;width:100%;text-align:left;padding:9px 11px;border-radius:8px;
  border:1px solid #3a3a3a;background:#111;color:#cfcfcf;font:inherit;cursor:pointer}
.mbtn b{display:block;font-size:12.5px;font-weight:600;color:#fff;margin-bottom:1px}
.mbtn span{display:block;font-size:11px;line-height:1.4;color:#8a8a8a}
.mbtn:hover{border-color:#8a8a8a;background:#191919}
/* Primary action uses the app's existing white-border treatment, not more red. */
.mbtn.go{border-color:#fff;background:#1c1c1c}
.mbtn.go:hover{background:#262626}
/* The devotions list is the tall part of the page; capped to the viewport at render
   time (fitDevotions) rather than a guessed vh, because everything above it -- the
   coverage panel especially -- changes height with the number of tags. */
.dscroll{overflow-y:auto;overflow-x:hidden;padding-right:8px}
.dscroll::-webkit-scrollbar{width:9px}
.dscroll::-webkit-scrollbar-track{background:#141414;border-radius:6px}
.dscroll::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:6px}
.dscroll::-webkit-scrollbar-thumb:hover{background:#5a5a5a}
.dscroll{scrollbar-width:thin;scrollbar-color:#3a3a3a #141414}
.plain{border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
.prow,.phead{display:grid;grid-template-columns:26px 24px 14px 1fr 26px 34px 34px;
  align-items:center;gap:6px;padding:3px 10px;font-size:12.5px;color:#cfcfcf}
.phead{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#6a6a6a;
  background:#161616;border-bottom:1px solid #2a2a2a}
.prow+.prow{border-top:1px solid #222}
.prow .pn,.prow .pp,.prow .pr,.prow .ph{font-variant-numeric:tabular-nums;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#7a7a7a}
.phead .pp,.phead .pr,.phead .ph{text-align:right}
.prow .pp,.prow .pr,.prow .ph{text-align:right}
.prow .pd{color:#3a3a3a;font-size:9px}
.prow.phit .pd{color:#4ade80}
.prow.phit .pnm{color:#fff}
.prow.phit .ph{color:#4ade80}
.prow.pfirst{background:#1a2418}
.prow.pref{color:#5f5f5f}
.prow.pref .pnm{color:#5f5f5f}
.prow .pnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .ppart{color:#8a8a8a;font-size:10.5px;margin-left:6px}
/* Tick box. The visible square is 17px but the button is 24x26 and fills the row
   height, so the hit area is comfortably bigger than the thing you aim at -- the
   same lesson the weight dots taught. */
.pck{width:24px;height:26px;padding:0;margin:0;background:transparent;border:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#3f3f3f}
.pck.ghost{cursor:default}
.pck i{width:17px;height:17px;border:1px solid #3a3a3a;border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  transition:border-color .12s,color .12s,background .12s}
.pck:hover i{border-color:#8a8a8a;color:#8a8a8a}
.pck.on{color:#4ade80}
.pck.on i{border-color:#4ade80;background:#132a1b}
.pck.part{color:#d9b03c}
.pck.part i{border-color:#8a7330;background:#241f10}
.pck:focus-visible{outline:2px solid #fff;outline-offset:-2px;border-radius:4px}
/* Bought: still legible, clearly behind you. */
.prow.pdone .pnm,.prow.pdone .pn{color:#6a6a6a}
.prow.pdone.phit .pnm{color:#8a8a8a}
.prow.pdone .pd{color:#2f4a35}
/* The step you're on, matching Detail's burnt orange. */
.prow.pcur{background:#261509;box-shadow:inset 3px 0 0 #e8743c}
.prow.pcur .pnm{color:#fff}
.mtabs{display:flex;gap:6px;margin-bottom:10px}
.mtab{flex:1;padding:6px 4px;border-radius:6px;border:1px solid #333;background:#111;color:#9a9a9a;font:inherit;font-size:12px;cursor:pointer;text-align:center;line-height:1.25}
.mtab:hover{border-color:#6a6a6a}
.mtab.on{background:#f2f2f2;color:#111;border-color:#f2f2f2}
.mtab .sub{display:block;font-size:10px;opacity:.65}
.cov{margin:0 0 4px;transition:opacity .12s ease}
/* While a solve is in flight these numbers describe the PREVIOUS plan, so say so
   rather than letting them look current. */
.cov.stale{opacity:.45}
.covrow{display:flex;align-items:center;gap:8px;font-size:11px;padding:2px 0}
.covrow .cn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#cfcfcf}
.covrow .cb{width:64px;height:4px;border-radius:2px;background:#262626;overflow:hidden;flex:none}
.covrow .cb i{display:block;height:100%;background:#8a8a8a}
.covrow .cv{width:52px;text-align:right;color:#8a8a8a;font-variant-numeric:tabular-nums;flex:none}
.covrow .cmax{width:28px;font-size:10px;color:#4ade80;flex:none;text-align:right}
.covrow.maxed .cb i{background:#4ade80}
.covrow.under .cv{color:#e8c15a}
.covrow.under .cb i{background:#e8c15a}
.covrow.zero .cn{color:#6f6f6f}
.covrow.zero .cv{color:#c46b6b}
/* Tags pulling against each other. Stated, not hidden -- someone chasing a tag that
   quietly starves the rest of the build should be told, and told WHY, since a zero
   never means the tree lacks the stat. Informational, so no red. */
.crowd{margin:6px 0 0;padding:7px 9px;border-radius:8px;border:1px solid #3a3427;
  background:#16150f;color:#a09a86;font-size:11px;line-height:1.5}
.crowd b{color:#e8c15a;font-weight:600}
/* The dots are small on purpose, but the CLICK area shouldn't be: a fixed-width,
   full-height target means you hit it without aiming, and fixing the width also stops
   the dots drifting left and right as tag names change length. */
.dots{display:inline-flex;gap:5px;align-items:center;justify-content:flex-end;
      height:100%;min-height:28px;flex:none;border-radius:6px}
/* Three 30px buttons, edge to edge: a 26px glyph in a 30px button leaves a small gap
   between stars while the hit areas still touch. 40px was too airy -- the cluster read
   as three separate controls rather than one rating. */
/* 26px of right padding -- one star-width of breathing room before the remove button,
   so the rating and the destructive control don't read as one cluster. Padding rather
   than a margin keeps the 90px of hit area intact. */
.dots.pick{width:90px;padding:0 26px 0 0;box-sizing:content-box;cursor:default}
/* Stars, not dots. It's a constellation tree -- the metaphor is right there, and a
   filled star reads as "more" without needing to be explained. Glyphs come from the
   Tabler font already loaded for the icons. */
/* Unicode star characters, not the icon font. `ti-star-filled` is absent from the
   Tabler webfont build loaded here, so every filled star rendered as nothing -- a
   three-star tag showed no stars at all, and raising a tag to 3 made its last visible
   star vanish. Characters have no such dependency. */
.dots span{display:block;flex:none;font-size:26px;line-height:1;color:#5a5a5a}

/* Colour carries the level, so you read it without counting: red low, amber medium,
   green high. Applied from the container's w1/w2/w3 class rather than per star, so all
   the filled stars agree -- two amber stars, not one red and one amber. */
.dots.w1 span.on{color:#e5484d;text-shadow:0 0 7px rgba(229,72,77,.75)}
.dots.w2 span.on{color:#e8c15a;text-shadow:0 0 7px rgba(232,193,90,.75)}
.dots.w3 span.on{color:#4ade80;text-shadow:0 0 7px rgba(74,222,128,.7)}

/* Interactive version on the target pill: click the star you mean. Each is a 20x26
   button so the hit area is comfortably bigger than the 12px glyph -- the lesson from
   the old three-dot control, which was fiddly for exactly this reason. */
/* Buttons widen with the glyph so the gap between stars doubles too -- spacing comes
   from the button width, not a flex gap, which keeps the hit areas touching with no
   dead pixels between them. */
.dots.pick{gap:0}
.dots.pick .star{width:30px;height:34px;padding:0;border:0;background:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
/* Centre the GLYPH, not just its line box. With line-height:1 a 26px star sits high in
   its own em box, so the button looked centred while the star didn't. Making the span a
   full-height flex box centres the ink instead of the metrics. */
.dots.pick .star span{display:flex;align-items:center;justify-content:center;
  width:100%;height:100%;line-height:1}
.dots.pick .star:hover span{color:#cfcfcf}
.dots.pick.w1 .star:hover span{color:#ff7a7d}
.dots.pick.w2 .star:hover span{color:#f3d585}
.dots.pick.w3 .star:hover span{color:#7ff0a8}
.dots.pick .star:focus-visible{outline:1px solid #fff;outline-offset:-2px;border-radius:4px}

/* Coverage repeats the colour but drops the glow -- five glowing rows would be noise,
   and nothing there is clickable. */
/* Coverage keeps small stars on purpose: up to five rows of them beside the bars, and
   nothing there is clickable. Doubling these would make the readout shout. */
.covrow .dots{width:44px;height:auto;min-height:0;padding:0 8px 0 0;cursor:default;gap:2px}
.covrow .dots span{font-size:12px;color:#3f3f3f}
.covrow .dots.w1 span.on{color:#a34b4e;text-shadow:none}
.covrow .dots.w2 span.on{color:#a38c4a;text-shadow:none}
.covrow .dots.w3 span.on{color:#4f9a68;text-shadow:none}
.covrow.under .cv{color:#e8c15a}
.actions{display:flex;gap:8px;margin-top:8px;align-items:center}
.status{flex:1;font-size:11px;color:#8a8a8a;display:flex;align-items:center;gap:7px;min-height:20px}
.pulse{width:7px;height:7px;border-radius:50%;background:#e8c15a;flex:none;animation:pl .9s ease-in-out infinite}

.resetall{height:40px;padding:0 14px;border-radius:8px;border:1px solid #3a3a3a;background:#141414;
          color:#9a9a9a;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
