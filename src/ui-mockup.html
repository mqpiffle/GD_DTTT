<!doctype html>
<meta charset="utf-8">
<title>GD_DTTT — Grim Dawn Devotion Theory-craft and Tracker Tool</title>
<!--
  Standalone mockup of the keyword picker. Reads ui-index.json (built by
  scripts/build-ui-index.mjs) rather than inlining data, so it stays in sync
  with the extraction.

  Serve it, don't open with file:// -- fetch() needs an origin:
      cd devotion-planner && python3 -m http.server 8080
      open http://localhost:8080/src/ui-mockup.html

  From WSL, the repo lives on the Windows drive:
      cd /mnt/d/gd-extract/devotion-planner && python3 -m http.server 8080
  and localhost is forwarded, so the URL above works in the Windows browser unchanged.
  Hard-refresh (Ctrl+Shift+R) after a rebuild -- ui-index.json is cached.

  The right panel is a real ordered path: lib/select.mjs picks a legal set of
  constellations, lib/schedule.mjs orders them and inserts/refunds Crossroads.
  Steps are numbered in the order you click them in game; click one to tick it off.

  There is no Build button: any change to the tags, their weights or the scoring mode
  re-solves automatically, debounced, with a status line that shows when it's working.
  The solve is synchronous, so its time budget is capped at a level measured to give
  the same answer as a much longer one (see SOLVE_BUDGET_MS).

  Selection is lib/solver.mjs -- local search, good but not proven optimal. Swap in
  the MILP (lib/milp.mjs + glpk.js) for a certificate; it returns the same
  [{id, starsTaken}] shape the scheduler consumes.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
:root{
  color-scheme:dark;
  /* Font-size tokens, 2 Aug (--fs-xs and --fs-xl added 2 Aug). Six steps in .125rem
     (2px) intervals either side of 1rem, not a full type scale -- this mirrors the
     --fs-sm/--fs-xs split: --fs-lg moved in to 1.125rem and .25rem needed its own
     name (--fs-xl) rather than being folded back into --fs-lg. Replaces ~15 ad-hoc px
     values (9px to 30px) that had accumulated across the file with no system behind
     them. Every font-size rule in this stylesheet points at one of these; nothing is
     a literal px value. Individual rules are being moved between steps one at a time,
     not in a single pass -- check the rule itself for its current token, not this
     comment. Existing var(--fs-lg) usage was NOT remapped to --fs-xl when --fs-lg's
     own value changed, same as --fs-sm's usages weren't touched when it moved to
     .875rem -- the token keeps its name, the rule just inherits the new value. */
  --fs-xs:.75rem;    /* 12px -- the smallest step; nothing assigned here yet */
  --fs-sm:.875rem;   /* 14px -- badges, meta text, section labels, table-style rows */
  --fs-base:1rem;    /* 16px -- standard reading size: names, tooltip body text */
  --fs-lg:1.125rem;  /* 18px -- one step up; currently just the tooltip bullet marker */
  --fs-xl:1.25rem;   /* 20px -- the top step; nothing assigned here yet */

  /* Color tokens, 2 Aug. Every color literal in the stylesheet is named here and
     nothing changed value in the process -- this is a rename, not a redesign, so
     the page should look pixel-identical to before this pass. A handful of
     near-duplicate values that were almost certainly accidental (one unit or two
     apart per channel -- #ececec next to #e6e6e6, #232323 next to #242424) were
     folded onto the more-common neighbor; anything a real design decision could
     plausibly separate was kept as its own step. Six families:
       --surface-*  backgrounds (near-black panel/card elevation steps)
       --ink-*      text, icons and borders on the neutral (achromatic) scale
       --line-*     hairline borders and dividers, same achromatic pool as ink
       --accent-*   the five meaningful hues (danger/warn/success/current/power)
                    and their variants, plus --glow-* for their rgba() shadows
       --tint-*     flat pre-mixed dark backgrounds carrying an accent's hue
       --af-*       the five affinity colors (already named; now variables too)
     Ink and line share one numbering scheme by lightness, not two, because the
     file already reuses the same literal gray for both text and borders in
     different rules (#8a8a8a is both a text color and a border color) -- keeping
     them in one pool matches how the values are actually used. */

  /* Surfaces: backgrounds only, darkest to lightest, generic/reusable ones.
     Numbered rather than named by role because most of these serve more than one
     component (e.g. --surface-2 is both the resting bg of .tab/.mbtn/.scoreopt AND
     the "dark text on a lit-up control" color for .tab.on etc.) -- a role name
     would have been wrong half the time it was used. */
  --surface-1:#0f0f1e;   --surface-2:#0e0e14;    --surface-3:#101016;
  --surface-4:#111117;   --surface-5:#121218;    --surface-6:#131319;
  --surface-7:#14141a;   --surface-8:#15151d;    --surface-9:#181820;
  --surface-10:#1f1f29;
  --surface-track:#303030;  /* Coverage bar's empty track -- its own step, not a
                                panel elevation */
  --tone-bright:#f2f2f2;    /* The "lit up" near-white: hover/active backgrounds
                                AND .orb.pts's own text -- same literal value, two
                                different jobs, one name that fits both */

  /* Ink/line: one achromatic scale, lightest (1) to darkest (15/10). Used for text,
     icon color and borders interchangeably, matching how the file already used
     them. Split into two families only because borders (--line-*) cluster in a
     much narrower, darker range than text (--ink-*) and giving them their own
     short list is easier to scan than one 25-step ramp. */
  --ink-1:#fff;      --ink-2:#e6e6e6;   --ink-3:#cfcfcf;   --ink-4:#b8b8b8;
  --ink-5:#b0b0b0;   --ink-6:#a8a8a8;   --ink-7:#9a9a9a;   --ink-8:#909090;
  --ink-9:#8a8a8a;   --ink-10:#7a7a7a;  --ink-11:#6f6f6f;  --ink-12:#6a6a6a;
  --ink-13:#5f5f5f;  --ink-14:#4f4f4f;  --ink-15:#4a4a4a;
  --line-1:#4d4d4d;  --line-2:#3f3f3f;  --line-3:#3d3d3d;  --line-4:#3a3a3a;
  --line-5:#333;     --line-6:#2e2e2e;  --line-7:#2a2a2a;  --line-8:#262626;
  --line-9:#222;     --line-10:#1f1f1f;

  /* Accents: the five hues that carry meaning throughout the app (see the
     comments at .card.current and .af-* below for why each was chosen). Variants
     are named for what they ARE, not where they're used -- "bright" is the
     star-picker hover color for all three weight tiers, so it only needed naming
     once per hue rather than once per rule. */
  --accent-danger:#e5484d;         --accent-danger-soft:#e07a7a;
  --accent-danger-bright:#ff7a7d;  --accent-danger-muted:#8a7070;
  --accent-danger-dim:#6a4a4a;     --accent-danger-border:#3a2a2a;
  --accent-warn:#e8c15a;           --accent-warn-bright:#f3d585;
  --accent-warn-deep:#d9b03c;      --accent-warn-border:#8a7330;
  --accent-success:#4ade80;        --accent-success-bright:#7ff0a8;
  --accent-success-muted:#2f4a35;  --accent-success-border:#3f6047;
  --accent-current:#90c5df;        --accent-current-bright:#c2e0f0;
  --accent-current-muted:#4b809b;
  --accent-power:#7fffd4;

  /* Glows: the rgba() form of each accent, for text-shadow and box-shadow. Kept
     as their own literals rather than derived from the accent hex (no color-mix()
     assumed) -- so if an accent hex ever changes, its glow needs updating too. */
  --glow-danger-1:rgba(229,72,77,.14);   --glow-danger-2:rgba(229,72,77,.6);
  --glow-danger-3:rgba(229,72,77,.75);
  --glow-warn-1:rgba(232,193,90,.6);     --glow-warn-2:rgba(232,193,90,.75);
  --glow-success-1:rgba(74,222,128,.6);  --glow-success-2:rgba(74,222,128,.7);
  --glow-current-1:rgba(144,197,223,.45); --glow-current-2:rgba(144,197,223,.26);

  /* Tints: flat, pre-mixed dark backgrounds that carry an accent's hue -- NOT the
     same as a glow, which is the accent itself at low alpha. These are authored
     as their own hex so they sit correctly over the surface color beneath them
     rather than genuinely compositing with whatever's underneath. */
  --tint-success:#161b17;         --tint-success-hover:#1c231d;
  --tint-success-strong:#132a1b;  --tint-success-highlight:#1a2418;
  --tint-danger:#241a1a;
  --tint-warn:#241f10;
  --tint-current:#11232c;  --tint-current-hover:#162f3b;  --tint-current-row:#0d1a21;
  --tint-power:#0d2f27;
  --tint-spent:rgba(255,255,255,.11);   /* .orb.pts's own background */

  /* Misc shadows, not tied to any one accent. */
  --shadow-soft:rgba(0,0,0,.65);     /* reused by .tip and .mbox */
  --overlay-scrim:rgba(6,6,6,.82);   /* the rush-offer modal's backdrop */

  /* Affinity hues. Already named via the .af-* classes below; now also variables
     so anything outside those five rules can reference the same colors without
     retyping the hex. Text, border and background are three independent picks
     per affinity, not one hue at three alphas -- see the comment at .af-ascendant
     for why (background intentionally samples a different, more saturated source
     than the text/border pair). */
  --af-ascendant:#b98ce8;   --af-ascendant-border:#6f4b96;
  --af-ascendant-bg:rgba(168,123,224,.13);
  --af-chaos:#ff5c9d;       --af-chaos-border:#93335c;
  --af-chaos-bg:rgba(255,92,157,.13);
  --af-eldritch:#b5e550;    --af-eldritch-border:#6a8a2c;
  --af-eldritch-bg:rgba(181,229,80,.13);
  --af-order:#f0ce6b;       --af-order-border:#8e7431;
  --af-order-bg:rgba(232,193,90,.13);
  --af-primordial:#5cb0f0;  --af-primordial-border:#2d6795;
  --af-primordial-bg:rgba(62,155,229,.13);
}
body{margin:0;padding:24px;background:var(--surface-1);color:var(--ink-1);font-family:system-ui,sans-serif;
  font-size:var(--fs-base);line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto}
.col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
/* Back to a single column: the three-across grid coupled card heights within a row,
   and the slack that created was worse than the space it saved. */
.cards{display:block}
.cards .card{margin-bottom:8px}
/* .selpane (left, selection widgets) / .dispane (right, plan display) mark the two
   halves of .col so a class shared by both panes -- .lbl, .plainbtn, .n -- can be
   overridden in just one of them. The 1 Aug trial flattened just the left pane to
   16px; the 2 Aug token pass below now covers the whole file, but these overrides
   stay because .plainbtn/.n still differ by pane (right pane keeps --fs-sm for
   these, since a card's meta line is secondary text, not the primary thing being
   read). .lbl is the exception: both panes' section titles -- Target tags,
   Coverage, Power scoring, Tag library on the left, Devotions on the right --
   read at --fs-base so no title looks smaller than its siblings. */
.selpane .lbl,.dispane .lbl{font-size:var(--fs-base)}
.selpane .plainbtn{font-size:var(--fs-base)}
.selpane .plainbtn i{font-size:var(--fs-base)}
.selpane .n{font-size:var(--fs-base)}
.lbl{font-size:var(--fs-sm);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-9);margin:0 0 7px}
/* Height follows the star control: 26px glyphs in 34px buttons need room, and
   `overflow:hidden` on a pill this shape would clip the glow rather than let it spill. */
.slot{display:flex;align-items:center;gap:4px;width:100%;height:44px;padding:0 6px 0 12px;border-radius:999px;margin-bottom:8px;background:var(--surface-9);color:var(--ink-1);font:inherit;text-align:left}
/* --fs-base: at the old 13px body default the tag name looked undersized next to a
   26px star and a 25px remove button. Sized to the controls, not to the body text.
   Now just the standard token like everything else in the 2 Aug pass, but it's the
   rule that started the argument for one. */
.slot > span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-size:var(--fs-base);line-height:1.2}
.empty{border:1px solid var(--line-4);color:var(--ink-14);cursor:default}
.full{border:1px solid var(--ink-1);cursor:pointer}
.rb{width:25px;height:25px;flex:none;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:var(--line-6);color:var(--ink-1);cursor:pointer;padding:0}
.chip .rb{pointer-events:none}
.empty .rb{background:var(--surface-10);color:var(--line-2)}
.full .rb:hover{background:var(--tone-bright);color:var(--surface-2)}
/* Reset all reuses the pill remove button's look -- same 25px circle, same minus
   glyph -- rather than being its own button style. It isn't inside a .slot.full, so
   it needs its own hover/disabled rules instead of inheriting .full .rb:hover. */
.rb:hover:not([disabled]){background:var(--tone-bright);color:var(--surface-2)}
.rb[disabled]{opacity:.35;cursor:default;pointer-events:none}
.tab{flex:1;height:31px;border-radius:6px;border:1px solid var(--line-5);background:var(--surface-2);color:var(--ink-7);font-size:var(--fs-base);cursor:pointer}
.tab.on{background:var(--tone-bright);color:var(--surface-2);border-color:var(--tone-bright)}
.cat{border-top:1px solid var(--line-8)}
.cath{display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 2px;background:none;border:0;color:var(--ink-3);font-size:var(--fs-base);cursor:pointer;text-align:left}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 4px 0 10px;margin:0 5px 5px 0;border-radius:999px;background:var(--surface-6);border:1px solid var(--line-5);color:var(--ink-2);font:inherit;font-size:var(--fs-sm);cursor:pointer}
.chip .rb{width:20px;height:20px}
.chip:hover:not(.used){background:var(--surface-10);border-color:var(--ink-12)}
.chip:hover:not(.used) .rb{background:var(--tone-bright);color:var(--surface-2)}
.chip.used{opacity:.35;cursor:default}
/* Blocked: this power cannot share 55 points with the ones already chosen. Struck
   through rather than merely faded, so it reads as "not available" instead of "already
   taken" -- the .used styling above means the opposite thing. */
.chip.blocked{opacity:.4;cursor:not-allowed;text-decoration:line-through;
  border-color:var(--accent-danger-border);color:var(--accent-danger-muted)}
.chip.blocked .rb{background:var(--tint-danger);color:var(--accent-danger-dim)}
/* Coverage row for a celestial power: binary, so no bar and no got/ceiling. */
.covrow.pow .cb{background:none;height:auto}
.covrow.pow .powcons{font-size:var(--fs-base);color:var(--ink-5);white-space:nowrap}
.covrow.pow .cv{color:var(--accent-success)}
.covrow.pow.zero .cv{color:var(--ink-12)}
.cpc{display:inline-block;font-size:var(--fs-base);line-height:1;padding:2px 5px;border-radius:999px;
  background:var(--tint-power);border:1px solid var(--accent-power);color:var(--accent-power);vertical-align:1px}
/* Where the weight dots would be on a power pill: a fixed marker, not a control. */
.tgt{display:flex;align-items:center;gap:3px;flex:none;font-size:var(--fs-base);letter-spacing:.06em;
  text-transform:uppercase;color:var(--accent-power);opacity:.75;cursor:default;padding:0 2px}
.tgt i{font-size:var(--fs-base)}
.slot.full.pow{border-color:var(--accent-power)}
.row{border-bottom:1px solid var(--line-10);padding:9px 2px}
.n{font-size:var(--fs-sm);color:var(--ink-9)}
.card{background:var(--surface-9);border:1px solid var(--ink-1);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{background:var(--surface-10)}
/* Completed: recede via border and a check, NOT opacity -- the text has to stay
   readable because you still need to see what a finished constellation gave you. */
.card.done{border-color:var(--accent-success-border);background:var(--tint-success)}
.card.done:hover{background:var(--tint-success-hover)}
/* The one you're on. */
/* "You are here" is a light, soft blue, not amber. Amber already means a weight-2 tag,
   an under-served coverage row and the solving pulse; a fourth meaning made it noise.
   Hue 200 is close to Primordial's hue (206), which DOES claim this part of the wheel --
   so this stays legible next to it by being deliberately paler and less saturated
   (55% sat / 72% light vs Primordial's 83%/65%) rather than by hue alone. */
.card.current{border-color:var(--accent-current);
  box-shadow:0 0 0 1px var(--glow-current-1),0 0 16px var(--glow-current-2)}
.card.refund{border-color:var(--line-4);background:var(--surface-3);cursor:default}
.card.refund:hover{background:var(--surface-3)}
.card.refund .nm{color:var(--ink-9);font-size:var(--fs-sm)}
.step{display:flex;align-items:baseline;gap:9px;padding:9px 11px}
.step .num{font-variant-numeric:tabular-nums;font-size:var(--fs-sm);color:var(--ink-9);min-width:18px}
.step .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
/* Title, CP badge and the star-count detail all share one line now. They're separate
   elements so each can carry its own tooltip, but `.body` is a flex COLUMN, so without
   this row each one became a full-width block on its own line. */
.nmrow{display:flex;align-items:baseline;gap:7px;min-width:0}
.nmrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nmrow .cp{flex:none}
.nmrow .n{flex:none;white-space:nowrap}
.step .nm{font-size:var(--fs-base)}
.stars{border-top:1px solid var(--line-6);padding:4px 0 5px}
.star{display:flex;gap:7px;padding:4px 10px;font-size:var(--fs-sm);color:var(--ink-9);cursor:pointer;align-items:flex-start}
.star:hover{background:var(--line-7)}
/* Bought stars. A strike-through inside a 10px rounded pill is invisible, so the
   line dims and a green check closes it instead -- the same signal as the tick box,
   read the same way. The check is excluded from the dimming rather than the whole
   line being faded, or the one element that says "done" would be the faintest. */
.star.sdone .stxt > *:not(.sck){opacity:.4}
.star.sdone .sn{opacity:.5}
.sck{color:var(--accent-success);font-size:var(--fs-sm);line-height:1;margin-left:1px}
/* Effect tooltip. Fixed position so nesting inside the re-rendered tree costs nothing,
   and pointer-events:none so it can never sit between the cursor and the row that
   summoned it -- which would flicker as the mouseover bounced between the two. */
.tip{position:fixed;left:0;top:0;z-index:40;max-width:420px;
  padding:11px 14px;border-radius:9px;border:1px solid var(--line-4);background:var(--surface-4);
  box-shadow:0 8px 24px var(--shadow-soft);
  /* --fs-base to match the target tag labels exactly -- two readouts a step apart look
     like a mistake rather than a hierarchy. Before the 2 Aug token pass this was a
     literal 16px next to the star-hit marker's 17px below; both now resolve to the
     same token, which was the point of naming three sizes instead of hand-tuning each
     one. */
  font-size:var(--fs-base);line-height:1.5;color:var(--ink-3);
  display:none;pointer-events:none}
/* A flex column with one gap, so every row shares the same rhythm. */
.tip.on{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
/* Prose variant. Stat tooltips are a LIST -- one short line per bonus, bulleted, clipped
   with an ellipsis rather than wrapped, because a wrapped stat line is hard to scan
   against the ones above it. An explanation is the opposite: it has to wrap, and a
   bullet in front of a paragraph is noise. Same tooltip, same positioning, different
   typography. */
.tip.prose{max-width:400px}
.tip.prose.on{gap:9px}
.tip.prose span{white-space:normal;overflow:visible;text-overflow:clip;padding-left:0;
  line-height:1.45}
.tip.prose span::before{content:none}
.tip b{display:block;margin-bottom:6px;color:var(--accent-power);font-weight:600;font-size:var(--fs-base);
  letter-spacing:.04em;text-transform:uppercase}
/* One bullet column for every row, so the text starts at the same x whether or not the
   line is tagged. Padding-left plus a negative-indent bullet keeps that alignment even
   when a line wraps. */
.tip span{display:block;position:relative;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%;line-height:1.4;padding-left:26px}
/* The marker is positioned ABSOLUTELY in a fixed 26px column, centred both ways.
   An inline-block ::before could not do this: `width` in `em` resolves against the
   pseudo-element's OWN font-size, so a 1.5em-wide box at font-size 1.5em is 2.25em
   while the same box at 1em is 1.5em -- the two markers sat in columns of different
   widths and the text after them never lined up. In px, out of flow, the column is the
   same for both no matter how the glyphs are sized. */
.tip span::before{content:'·';position:absolute;left:0;top:50%;
  transform:translateY(-50%);width:26px;text-align:center;line-height:1;
  font-size:var(--fs-lg);color:var(--ink-9)}
/* A bonus that serves one of your tags is bulleted with a STAR in that tag's weight
   colour -- the same red/amber/green as the weight control, so the two readouts agree
   without needing a legend, and the marker matches the metaphor. */
.tip span.hit{font-weight:600;color:var(--ink-2)}
/* Only the glyph and its size change -- the column geometry is inherited, so the two
   markers cannot drift apart. */
.tip span.hit::before{content:'\2605';font-size:var(--fs-base)}
.tip span.hit.w1::before{color:var(--accent-danger);text-shadow:0 0 7px var(--glow-danger-2)}
.tip span.hit.w2::before{color:var(--accent-warn);text-shadow:0 0 7px var(--glow-warn-1)}
.tip span.hit.w3::before{color:var(--accent-success);text-shadow:0 0 7px var(--glow-success-1)}
/* The card title and the CP badge are now hover targets. */
.step .nm[data-fx],.step .cp[data-fx]{cursor:help}
.step .nm[data-fx]:hover{color:var(--ink-1);text-decoration:underline dotted var(--ink-13)}

/* The next star to buy. Same hue as the current card's border (#90c5df), but as a dark
   tint plus a solid left bar rather than a solid fill. A solid fill would need
   dark text, and this row carries tag pills (.tg, light-on-dark) that would then have to
   invert too -- the bar carries the colour at full strength instead, and matches how the
   current row is marked in Overview. Flat, no glow: the card is already glowing, and two
   glows on screen stop meaning "here". */
.star.snext{background:var(--tint-current);box-shadow:inset 3px 0 0 var(--accent-current)}
.star.snext:hover{background:var(--tint-current-hover)}
.star.snext .sn{color:var(--accent-current-bright);font-weight:600}
.star .sn{color:var(--ink-13);min-width:12px;font-variant-numeric:tabular-nums;padding-top:2px}
/* Tree gutter: one monospace character per level, so it lines up down the column
   without needing a fixed width per row. Empty on the root, which costs nothing. */
.star .stree{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-sm);
  line-height:1.35;color:var(--ink-15);white-space:pre;padding-top:2px;letter-spacing:0}
.star.snext .stree{color:var(--accent-current-muted)}
.star.sdone .stree{opacity:.45}
.star .stxt{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.star .nm2{color:var(--ink-2);margin-right:2px}

import { DEFAULT_WEIGHT, MAX_WEIGHT, clampWeight } from './lib/wanted.mjs';

const MAX = 5;
// [button label, tooltip]. The label is short enough to read as a tile; the
// explanation lives in the tooltip, so it can be a full sentence instead of the
// clipped fragment that fit under a button.
const MODES = [
  ['Passives', 'Celestial powers ignored entirely — constellations are worth only their'
    + ' passive stats and the affinity they grant'],
  ['Balanced', 'Celestial powers valued at the rank you actually buy them at, which is'
    + ' rank 1 for most of a levelling build'],
  ['CP Max', 'Celestial powers valued at their own maximum rank — favours going deep on'
    + ' a few powers over spreading across many'],
];
// A fourth plan that isn't a scoring choice: the same set of constellations, re-ordered
// around what you've actually bought. Only offered once you've gone off-plan.
const CUSTOM = MODES.length;
const app = document.getElementById('app');

const raw = await fetch('../ui-index.json').then(r => r.json());
const chips = raw.chips;
const db = buildDb(raw);

const state = {
  // Sized from MAX, not a literal -- a three-slot array silently caps you at three
  // picks no matter what MAX says, because sel.indexOf(null) can't find a fourth.
  sel: Array(MAX).fill(null), tab: 'character', mode: 1,
  weights: Array(MAX).fill(DEFAULT_WEIGHT),   // how much each slot's tag matters, 1-3
  open: new Set(['character|Offense']),
  plan: null, error: null, builtMode: null, solving: false,
  done: new Set(),        // stars ticked off in game, keyed constellation:star
  plain: false,           // Overview: the whole path as one scannable column
  custom: null,           // a plan re-ordered around your progress, or null
  // Which bought set the re-order prompt was last dismissed for. It blocks the list,
  // so "ignore it" can't be how you decline -- there has to be a way out, and it has
  // to stay out. Keyed by the bought set rather than a plain boolean so that ticking
  // something else out of order asks again, which is a different question.
  offerSeen: null,
  // Power chips that can no longer fit alongside what's already chosen. Computed after
  // the solve rather than inside it -- the sweep costs ~250ms, which would be felt on
  // every keystroke for something that only starts blocking at four powers.
  blocked: new Set(),
};
let renderedTab = state.tab;

// --- undo --------------------------------------------------------------------
// One click can now do a lot: ticking a late constellation completes everything its
// affinity depends on, so a misclick is destructive in a way a single toggle never
// was. Undo covers exactly the thing those clicks mutate -- `state.done`.

// Depth is 60 because it costs nothing to be generous: a snapshot is at most 55
// short strings, so the whole stack is well under 100 KB, far below anything worth
// bounding for memory. 60 is "more steps than you'll take before noticing a
// mistake", which is the number that actually matters.

// different tag set refers to constellations that are no longer on screen, and
// restoring it would look like a bug.
const HISTORY_MAX = 60;
let history = [];

const pushHistory = () => {
  history.push(new Set(state.done));
  if (history.length > HISTORY_MAX) history.shift();
